<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#16a34a">
  <meta name="description" content="나 혼자 쓰는 식단기록">
  <title>식단기록</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <div id="app">
    <main class="views">
      <!-- 캘린더 (메인) -->
      <section id="view-calendar" class="view active" aria-label="캘린더"><p class="loading-note">기록을 불러오는 중…</p></section>

      <!-- 통계 -->
      <section id="view-stats" class="view" aria-label="통계" hidden></section>

      <!-- 내 정보 -->
      <section id="view-profile" class="view" aria-label="내 정보" hidden>
        <header class="view-header"><h1>내 정보</h1></header>
        <div id="profile-root" class="scroll"></div>
      </section>

      <p id="fatal" class="fatal" role="alert" hidden></p>
    </main>

    <nav class="tabbar" role="tablist" aria-label="메뉴">
      <button type="button" role="tab" data-tab="calendar" aria-selected="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/></svg>
        <span>캘린더</span>
      </button>
      <button type="button" role="tab" data-tab="stats" aria-selected="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M12 20V5M19 20v-7"/></svg>
        <span>통계</span>
      </button>
      <button type="button" role="tab" data-tab="profile" aria-selected="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20c1.2-3.8 4-5.6 7.5-5.6s6.3 1.8 7.5 5.6"/></svg>
        <span>내 정보</span>
      </button>
    </nav>
  </div>

  <!-- 일별 상세 (그래프 + 입력 표) -->
  <section id="day-layer" class="screen layer" aria-label="일별 상세" inert>
    <header class="top-bar">
      <button id="day-back" class="icon-btn" type="button" aria-label="캘린더로">←</button>
      <h1 class="day-title"><span id="day-title"></span> <span id="day-today" class="badge" hidden>오늘</span></h1>
      <button id="day-prev" class="icon-btn" type="button" aria-label="이전 날">‹</button>
      <button id="day-next" class="icon-btn" type="button" aria-label="다음 날">›</button>
    </header>
    <div id="day-scroll" class="scroll day-scroll">
      <div class="day-grid">
        <div class="day-main">
          <section id="day-charts" class="card day-charts" aria-label="그래프"></section>
          <section class="card table-card">
            <div id="day-table"></div>
            <p class="hint table-hint">빈 줄에 바로 입력 · "제육볶음 200g", "바나나 1개", "김밥 반" · Enter 다음 줄 · × 또는 왼쪽으로 밀어 삭제 · kcal을 길게 눌러 수정</p>
          </section>
        </div>
        <aside class="day-side">
          <section id="day-workout" class="card wo-card" aria-label="오늘의 운동"></section>
          <section id="day-eval" class="card eval-card" aria-label="식단 평가"></section>
        </aside>
      </div>
    </div>
  </section>

  <div class="offline-pill" aria-hidden="true">오프라인</div>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
